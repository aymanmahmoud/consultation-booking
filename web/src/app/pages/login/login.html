<div class="auth-container">
  <div class="auth-card card animate-fade-in">
    <div class="auth-header">
      <h2>Welcome Back</h2>
      <p>Sign in to access your consultations and appointments</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          class="input-field"
          placeholder="name@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          class="input-field"
          placeholder="••••••••"
          required
        />
      </div>

      <button type="submit" [disabled]="isLoading" class="btn btn-primary btn-block">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create an account</a></p>
    </div>
  </div>
</div>
